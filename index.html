<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IDO OVADYA</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 40px 20px;
      color: #000;
    }

    .container {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .profile-img {
      width: 148px;
      height: 148px;
      border-radius: 50%;
      border: 3px solid #000;
      object-fit: cover;
      object-position: center 10%;
      display: block;
    }

    .name {
      margin-top: 22px;
      font-size: 28px;
      font-weight: 700;
      letter-spacing: 4px;
      text-transform: uppercase;
    }

    .divider {
      width: 40px;
      height: 2px;
      background: #000;
      margin: 14px auto 18px;
    }

    .titles {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 36px;
    }

    .titles p {
      font-size: 16px;
      color: #333;
      line-height: 1.5;
    }

    .buttons {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: #000;
      color: #fff;
      border-radius: 50px;
      padding: 14px 24px;
      text-decoration: none;
      font-weight: 600;
      font-size: 16px;
      transition: background 0.2s ease, transform 0.1s ease;
    }

    .btn:hover {
      background: #222;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn svg {
      width: 22px;
      height: 22px;
      flex-shrink: 0;
    }

    @media (max-width: 480px) {
      .name {
        font-size: 24px;
        letter-spacing: 3px;
      }
      .titles p {
        font-size: 15px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <img src="profile.png" alt="IDO OVADYA" class="profile-img">

    <h1 class="name">IDO OVADYA</h1>
    <div class="divider"></div>

    <div class="titles">
      <p>יזם ומאמן מנטלי</p>
      <p>מייסד פלטפורמת חיילים ביחד</p>
      <p>Founder &amp; CEO at CoachMind</p>
    </div>

    <div class="buttons">
      <a class="btn" href="https://soldiers-together-app.base44.app" target="_blank" rel="noopener noreferrer">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
          <circle cx="9" cy="7" r="4"></circle>
          <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
          <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
        </svg>
        <span>חיילים ביחד</span>
      </a>

      <a class="btn" href="https://www.linkedin.com/in/ido-ovadya-923ab0380/" target="_blank" rel="noopener noreferrer">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path d="M20.45 20.45h-3.55v-5.57c0-1.33-.02-3.04-1.85-3.04-1.85 0-2.13 1.45-2.13 2.94v5.67H9.36V9h3.41v1.56h.05c.48-.9 1.64-1.85 3.37-1.85 3.6 0 4.27 2.37 4.27 5.45v6.29zM5.34 7.43a2.06 2.06 0 1 1 0-4.13 2.06 2.06 0 0 1 0 4.13zM7.12 20.45H3.56V9h3.56v11.45zM22.22 0H1.77C.79 0 0 .77 0 1.72v20.56C0 23.23.79 24 1.77 24h20.45c.98 0 1.78-.77 1.78-1.72V1.72C24 .77 23.2 0 22.22 0z"/>
        </svg>
        <span>LinkedIn</span>
      </a>

      <a class="btn" href="https://www.youtube.com/@IdoOvadya" target="_blank" rel="noopener noreferrer">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path d="M23.5 6.2a3 3 0 0 0-2.1-2.1C19.5 3.5 12 3.5 12 3.5s-7.5 0-9.4.6A3 3 0 0 0 .5 6.2C0 8.1 0 12 0 12s0 3.9.5 5.8a3 3 0 0 0 2.1 2.1c1.9.6 9.4.6 9.4.6s7.5 0 9.4-.6a3 3 0 0 0 2.1-2.1c.5-1.9.5-5.8.5-5.8s0-3.9-.5-5.8zM9.6 15.6V8.4l6.2 3.6-6.2 3.6z"/>
        </svg>
        <span>הפודקאסט שלי</span>
      </a>
    </div>
  </div>
</body>
</html>
