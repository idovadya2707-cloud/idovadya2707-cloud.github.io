  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

Legibility;\n    min-height: 100svh; display: flex; flex-direction: column;\n  }\n  h1, h2, h3 { font-family: var(--font-head); color: var(--white); margin: 0; line-height: 1.16; letter-spacing: -0.02em; text-wrap: balance; }\n  p { margin: 0; text-wrap: pretty; }\n  a { color: inherit; text-decoration: none; }\n\n  .ambient {\n    position: fixed; inset: 0; z-index: 0; pointer-events: none;\n    background: radial-gradient(120% 80% at 50% -10%, #141b34 0%, #0b0c14 46%, #08080a 100%);\n  }\n  .stage { position: relative; z-index: 1; flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 72px 26px 84px; }\n  .wrap { width: 100%; max-width: var(--maxw); margin: 0 auto; text-align: center; }\n\n  /* wordmark */\n  .mark { font-family: var(--font-head); font-weight: 900; font-size: 18px; letter-spacing: .02em; color: var(--white); }\n  .mark-sub { margin-top: 8px; font-weight: 300; font-size: 11.5px; letter-spacing: .34em; color: var(--steel); text-transform: none; }\n  .mark-block { margin-bottom: 56px; }\n\n  /* confirmation */\n  .check {\n    width: 64px; height: 64px; border-radius: 50%; margin: 0 auto 26px;\n    display: grid; place-items: center; color: var(--hair); font-size: 26px; font-weight: 700;\n    background: rgba(147,162,192,.10); border: 1px solid rgba(170,178,192,.26);\n  }\n  .confirm-eyebrow {\n    display: inline-block; font-family: var(--font-head); font-weight: 600;\n    font-size: 12px; letter-spacing: .3em; text-transform: uppercase; color: var(--steel); margin-bottom: 20px;\n  }\n  .confirm-title { font-size: clamp(28px, 5vw, 46px); font-weight: 800; }\n  .confirm-sub { margin: 18px auto 0; font-size: clamp(17px, 2.2vw, 20px); color: var(--muted); max-width: 44ch; }\n\n  /* divider bridge */\n  .bridge { margin: 54px auto 40px; max-width: 52ch; }\n  .bridge-rule { width: 1px; height: 46px; margin: 0 auto 30px; background: linear-gradient(var(--hair), transparent); opacity: .5; }\n  .bridge-text { font-family: var(--font-head); font-weight: 700; font-size: clamp(21px, 3vw, 30px); color: var(--off); line-height: 1.4; }\n\n  /* episode card */\n  .episode {\n    display: block; width: 100%; max-width: 760px; margin: 0 auto;\n    background: var(--surface); border: 1px solid var(--divider-strong); border-radius: 20px;\n    overflow: hidden; box-shadow: 0 40px 90px rgba(0,0,0,.6);\n    transition: transform .4s cubic-bezier(.16,.7,.3,1), box-shadow .4s ease, border-color .4s ease;\n  }\n  .episode:hover { transform: translateY(-5px); border-color: rgba(170,178,192,.34); box-shadow: 0 50px 110px rgba(0,0,0,.7); }\n  .thumb { position: relative; aspect-ratio: 16 / 9; overflow: hidden; }\n  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform 1.4s cubic-bezier(.16,.7,.3,1); }\n  .episode:hover .thumb img { transform: scale(1.05); }\n  .thumb-veil { position: absolute; inset: 0; background: linear-gradient(to top, rgba(8,8,10,.55), rgba(8,8,10,.05) 50%, rgba(8,8,10,.25)); }\n  .play {\n    position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);\n    width: 88px; height: 88px; border-radius: 50%;\n    background: rgba(10,10,12,.5); backdrop-filter: blur(3px);\n    border: 1.5px solid rgba(255,255,255,.7);\n    display: grid; place-items: center;\n    transition: background .35s ease, transform .35s cubic-bezier(.16,.7,.3,1), border-color .35s ease;\n  }\n  .episode:hover .play { background: rgba(255,255,255,.96); border-color: #fff; transform: translate(-50%,-50%) scale(1.06); }\n  .play svg { width: 30px; height: 30px; margin-right: -4px; fill: #fff; transition: fill .35s ease; }\n  .episode:hover .play svg { fill: #0a0a0b; }\n  .yt-tag {\n    position: absolute; bottom: 16px; right: 16px;\n    display: inline-flex; align-items: center; gap: 8px;\n    font-family: var(--font-head); font-weight: 600; font-size: 12.5px; color: #fff;\n    background: rgba(10,10,12,.6); border: 1px solid rgba(255,255,255,.18);\n    padding: 7px 13px; border-radius: 999px; letter-spacing: .02em;\n  }\n  .yt-tag .yt { width: 18px; height: 13px; }\n\n  .ep-body { padding: 30px 34px 34px; text-align: right; }\n  .ep-kicker { font-family: var(--font-head); font-weight: 600; font-size: 12px; letter-spacing: .26em; text-transform: uppercase; color: var(--steel); margin-bottom: 14px; }\n  .ep-title { font-size: clamp(21px, 3.2vw, 30px); font-weight: 800; line-height: 1.3; }\n  .ep-why { margin-top: 18px; font-size: 16.5px; color: var(--muted); line-height: 1.72; }\n  .ep-topics { list-style: none; margin: 16px 0 0; padding: 0; display: flex; flex-direction: column; gap: 11px; }\n  .ep-topics li {\n    position: relative; padding-right: 22px;\n    font-size: 16.5px; color: var(--off); line-height: 1.5;\n  }\n  .ep-topics li::before {\n    content: \"\"; position: absolute; top: 11px; right: 0;\n    width: 7px; height: 7px; border-radius: 50%;\n    background: var(--steel);\n  }\n  .ep-foot { margin-top: 18px; font-family: var(--font-head); font-weight: 700; font-size: 16px; color: var(--off); }\n  .ep-action {\n    margin-top: 26px; display: inline-flex; align-items: center; gap: 10px;\n    font-family: var(--font-head); font-weight: 700; font-size: 17px; color: #fff;\n    background: linear-gradient(135deg, #34568c, #1f2c5e);\n    border: 1px solid rgba(170,178,192,.22); padding: 15px 32px; border-radius: 12px;\n    box-shadow: 0 14px 34px rgba(0,0,0,.42); transition: filter .35s ease, transform .35s ease;\n  }\n  .episode:hover .ep-action { filter: brightness(1.1); }\n  .ep-action .arrow { font-size: 18px; transform: translateY(1px); }\n\n  .closing { margin-top: 48px; font-family: var(--font-head); font-weight: 500; font-size: clamp(17px, 2.2vw, 21px); color: var(--hair); line-height: 1.6; }\n\n  footer { position: relative; z-index: 1; border-top: 1px solid var(--divider); padding: 30px 0; text-align: center; }\n  .foot-line { font-family: var(--font-head); font-size: 13.5px; color: var(--muted-dim); letter-spacing: .04em; }\n\n  /* reveal */\n  .reveal { opacity: 1; transform: none; }\n  @keyframes revealUp { from { opacity: 0; transform: translateY(26px); } to { opacity: 1; transform: none; } }\n  html.anim .reveal { animation: revealUp .85s cubic-bezier(.16,.7,.3,1) both; }\n  html.anim .reveal.d1 { animation-delay: .08s; }\n  html.anim .reveal.d2 { animation-delay: .18s; }\n  html.anim .reveal.d3 { animation-delay: .30s; }\n  html.anim .reveal.d4 { animation-delay: .42s; }\n  html.seen .reveal { opacity: 1 !important; transform: none !important; animation: none !important; }\n  @media (prefers-reduced-motion: reduce) { html.anim .reveal { animation: none; } html { scroll-behavior: auto; } }\n\n  @media (max-width: 560px) {\n    body { font-size: 17px; }\n    .stage { padding: 56px 20px 64px; }\n    .mark-block { margin-bottom: 40px; }\n    .ep-body { padding: 26px 24px 28px; }\n    .play { width: 72px; height: 72px; }\n    .ep-action { width: 100%; justify-content: center; }\n  }\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n  \n  <div class=\"ambient\"><\u002Fdiv>\n\n  <main class=\"stage\" data-screen-label=\"thankyou\">\n    <div class=\"wrap\">\n      <div class=\"mark-block reveal\">\n        <div class=\"mark\">עידו עובדיה<\u002Fdiv>\n        <div class=\"mark-sub\">לחיות את הפוטנציאל שלך<\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"check reveal d1\">✓<\u002Fdiv>\n      <span class=\"confirm-eyebrow reveal d1\">הפרטים התקבלו<\u002Fspan>\n      <h1 class=\"confirm-title reveal d1\">קיבלתי את הפרטים שלך.<\u002Fh1>\n      <p class=\"confirm-sub reveal d2\">אחזור אליך בהקדם.<\u002Fp>\n\n      <div class=\"bridge reveal d2\">\n        <div class=\"bridge-rule\"><\u002Fdiv>\n        <p class=\"bridge-text\">בינתיים, מוזמן להיכנס לפודקאסט שלי.<\u002Fp>\n      <\u002Fdiv>\n\n      <a class=\"episode reveal d3\" href=\"https://youtu.be/JbwZbz0Mt2U?si=x8m8FDmY16rx-Qc5\" target=\"_blank\" rel=\"noopener\" aria-label=\"צפייה בפודקאסט ביוטיוב\">\n        <div class=\"thumb\">\n          <img src=\"885fcad6-215e-4932-ab49-8cf877d72fb2\" alt=\"איך לדעת מה אתה רוצה\">\n          <div class=\"thumb-veil\"><\u002Fdiv>\n          <div class=\"play\">\n            <svg viewBox=\"0 0 24 24\"><path d=\"M8 5v14l11-7z\"><\u002Fpath><\u002Fsvg>\n          <\u002Fdiv>\n          <span class=\"yt-tag\">\n            <svg class=\"yt\" viewBox=\"0 0 28 20\" fill=\"none\"><rect width=\"28\" height=\"20\" rx=\"5\" fill=\"#FF0000\"><\u002Frect><path d=\"M11 6l7 4-7 4V6z\" fill=\"#fff\"><\u002Fpath><\u002Fsvg>\n            צפייה ביוטיוב\n          <\u002Fspan>\n        <\u002Fdiv>\n        <div class=\"ep-body\">\n          <div class=\"ep-kicker\">הפודקאסט שלי<\u002Fdiv>\n          <h2 class=\"ep-title\">לחיות את הפוטנציאל שלך.<\u002Fh2>\n          <p class=\"ep-why\">אתה לא צריך עוד ידע. הבעיה היא תפיסות החשיבה שמפעילות אותך מבפנים, ושם אנחנו עובדים — עוקרים את השורש, לא את הבעיה השטחית. מה תמצא כאן:<\u002Fp>\n          <ul class=\"ep-topics\">\n            <li>איך לדעת מה אתה רוצה ולבנות לשם את הדרך.<\u002Fli>\n            <li>איך לשנות את האמונות העמוקות שמחזיקות אותך במקום.<\u002Fli>\n            <li>איך לשלוט במחשבות שלך ולהטות אותן למטרות שלך.<\u002Fli>\n          <\u002Ful>\n          <p class=\"ep-foot\">בלי מילים יפות. רק מה שעובד באמת.<\u002Fp>\n          <span class=\"ep-action\">להאזנה לפודקאסט <span class=\"arrow\">←<\u002Fspan><\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fa>\n    <\u002Fdiv>\n  <\u002Fmain>\n\n  <footer>\n    <div class=\"foot-line\">© עידו עובדיה · לחיות את הפוטנציאל שלך<\u002Fdiv>\n  <\u002Ffooter>\n\n<script>\n  (function () {\n    var docEl = document.documentElement;\n    function showStatic() { docEl.classList.add('seen'); }\n    if (document.hidden) { showStatic(); }\n    else { docEl.classList.add('anim'); }\n    document.addEventListener('visibilitychange', function () { if (document.hidden) showStatic(); });\n    var painted = false;\n    requestAnimationFrame(function () { requestAnimationFrame(function () { painted = true; }); });\n    setTimeout(function () { if (!painted) showStatic(); }, 700);\n  })();\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
